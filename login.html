<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hogwarts Entrance</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle, #0b0b0f, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: 'Cinzel', serif;
    }
    .gate {
      text-align: center;
      padding: 3rem;
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 0 40px rgba(180,140,255,0.4);
      border-radius: 20px;
      background: rgba(0,0,0,0.6);
    }
    input, button {
      margin-top: 1rem;
      padding: 0.8rem 1.5rem;
      font-family: inherit;
      border-radius: 30px;
      border: none;
    }
    button {
      background: rgba(180,140,255,0.2);
      color: white;
      cursor: pointer;
    }
    button:hover {
      box-shadow: 0 0 20px rgba(180,140,255,0.6);
    }
  </style>
</head>
<body>

<div class="gate">
  <h1>Enter Hogwarts</h1>
  <p>Your name, please.</p>
  <input type="text" id="wizard-name" placeholder="Wizard Name">
  <br>
  <button onclick="login()">Reveal the Path</button>
</div>

<script>
function login() {
  const name = document.getElementById("wizard-name").value.trim();
  if (!name) return alert("Magic requires a name.");

  localStorage.setItem("hogwartsUser", name);
  window.location.href = "index.html";
}
</script>

</body>
</html>
